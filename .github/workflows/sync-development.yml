# Keep long-lived `development` equal to `master` after promotion.
# Squash/rebase merges leave development ahead/behind; this resets it safely.
name: Sync development with master

on:
  pull_request:
    types: [closed]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-development-with-master
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-development:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || (
        github.event_name == 'pull_request'
        && github.event.pull_request.merged == true
        && github.event.pull_request.head.ref == 'development'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when an open development → master PR still exists
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "master",
              head: `${context.repo.owner}:development`,
              per_page: 10,
            });
            const skip = data.length > 0;
            if (skip) {
              core.notice(
                `Skipping reset: ${data.length} open PR(s) from development → master.`,
              );
            }
            core.setOutput("skip", skip ? "true" : "false");

      - name: Reset development to origin/master
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/development:refs/remotes/origin/development

          master_sha="$(git rev-parse refs/remotes/origin/master)"
          development_sha="$(git rev-parse refs/remotes/origin/development)"

          if [ "$master_sha" = "$development_sha" ]; then
            echo "development already matches master ($master_sha)."
            exit 0
          fi

          echo "Resetting development → $master_sha (was $development_sha)"
          if ! git push --force-with-lease="refs/heads/development:${development_sha}" \
            origin "${master_sha}:refs/heads/development"; then
            echo "::error::Could not reset development. Newer commits or branch rules may block the push."
            exit 1
          fi
          echo "development now matches master."
